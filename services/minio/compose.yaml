services:
  minio:
    image: minio/minio:${MINIO_VERSION}
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"
    env_file:
      - path: ../../${ENV_FILE:-.env}
        required: true
    volumes:
      - monitoring_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  create_buckets:
    image: minio/mc:${MC_VERSION}
    container_name: create_buckets
    env_file:
      - path: ../../${ENV_FILE:-.env}
        required: true
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/loki &&
      mc mb --ignore-existing local/mimir &&
      mc mb --ignore-existing local/tempo &&
      mc mb --ignore-existing local/mlflow
      "

volumes:
  monitoring_minio:
    name: monitoring_minio
