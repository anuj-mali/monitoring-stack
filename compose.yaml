include:
  - ./services/litellm/compose.yaml
  - ./services/mlflow/compose.yaml
  - ./services/minio/compose.yaml
  - ./services/grafana/compose.yaml
  - ./services/prometheus/compose.yaml

services:
  postgres:
    image: postgres:latest
    container_name: monitoring_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    env_file:
      - ./.env
    volumes:
      - monitoring_db:/var/lib/postgresql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  monitoring_db:
