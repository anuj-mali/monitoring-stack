# Mimir single-binary mode
target: all

multitenancy_enabled: false

common:
  storage:
    backend: s3
    s3:
      endpoint: minio:9000
      access_key_id: ${MINIO_ROOT_USER}
      secret_access_key: ${MINIO_ROOT_PASSWORD}
      insecure: true  # no TLS on internal minio

blocks_storage:
  storage_prefix: blocks
  s3:
    bucket_name: mimir
  tsdb:
    dir: /data/tsdb

compactor:
  data_dir: /data/compactor

ruler_storage:
  storage_prefix: ruler
  s3:
    bucket_name: mimir

alertmanager_storage:
  storage_prefix: alertmanager
  s3:
    bucket_name: mimir

ingester:
  ring:
    replication_factor: 1

store_gateway:
  sharding_ring:
    replication_factor: 1

server:
  http_listen_port: 8080
  grpc_listen_port: 9095
  log_level: warn
