services:
  mimir:
    image: grafana/mimir:${MIMIR_VERSION}
    container_name: mimir
    env_file:
      - ../../.env
    volumes:
      - ./config.yaml:/etc/mimir/config.yaml:ro
      - mimir_data:/data
    command:
      - --config.file=/etc/mimir/config.yaml
      - --config.expand-env=true
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mimir_data:
    name: mimir_data